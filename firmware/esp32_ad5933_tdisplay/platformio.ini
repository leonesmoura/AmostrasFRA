; AMOSTRAS FRA 2.0 - Firmware TTGO T-Display <-> AD5933 (KDT5933-013)
; ===================================================================
; Placa: TTGO T-Display (ESP32-D0WDQ6-V3) com display ORIGINAL TROCADO
; por um NFP096H-01AY (IPS 0,96", ST7735, 80x160) no mesmo flat.
;
; ATENCAO: NAO usar o setup de TTGO padrao do TFT_eSPI (ST7789 135x240).
; O perfil correto deste painel e' ST7735 REDTAB160x80 (offset 24,0,
; SEM inversao de cor) - validado em bancada em 2026-08-03.
;
; Gravar:   pio run -t upload      (porta padrao: COM22)
; Monitor:  pio device monitor

[env:tdisplay_ad5933]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM22
monitor_port = COM22
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DUSER_SETUP_LOADED
    -DST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_REDTAB160x80
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=27000000
